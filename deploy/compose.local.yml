# Local stack: same images and nginx routing as production, with Postgres, Redis and a mail catcher on this machine.
services:
  migrate:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    ports:
      - "${NGINX_PORT:-8080}:80"
    environment:
      NGINX_PORT: ${NGINX_PORT:-8080}
      # Next dev server on the host (npm run dev); frontend:3000 for the `frontend` container (--profile frontend)
      FRONTEND_HOST: ${FRONTEND_HOST:-host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/templates-local:/etc/nginx/templates:ro

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: celebobo
      POSTGRES_USER: celebobo
      POSTGRES_PASSWORD: celebobo
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celebobo -d celebobo"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  postgres:
  redis:
