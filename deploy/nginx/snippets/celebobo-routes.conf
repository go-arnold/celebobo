# Routing shared by the local and production servers. The server sets $api, $frontend and $forwarded_proto.
# Upstreams are resolved per request (Docker DNS), so nginx starts even when the frontend is not running.
resolver 127.0.0.11 valid=10s ipv6=off;

client_max_body_size 10m;

proxy_http_version 1.1;
include /etc/nginx/snippets/proxy-headers.conf;
proxy_set_header Connection "";
# nginx sets HSTS for the whole site in production
proxy_hide_header Strict-Transport-Security;
proxy_connect_timeout 5s;
proxy_read_timeout 35s;
proxy_send_timeout 35s;

gzip on;
gzip_proxied any;
gzip_types application/json text/css application/javascript image/svg+xml text/plain;
gzip_min_length 1024;

# Assistant replies are streamed (Server-Sent Events): no buffering, longer reads.
location /api/v1/assistant/ {
    proxy_pass $api;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
}

location /api/ {
    proxy_pass $api;
}

# WebSockets (Django Channels)
location /ws/ {
    proxy_pass $api;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location /django-admin/ {
    proxy_pass $api;
}

location /health/ {
    proxy_pass $api;
    access_log off;
}

# Django static files (admin, API docs), served by WhiteNoise with long cache headers.
location /static/ {
    proxy_pass $api;
}

# Next.js static assets: immutable, safe to keep for a year.
location /_next/static/ {
    proxy_pass $frontend;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Next dev server hot reload (local development only): /_next/hmr (Next 16) or /_next/webpack-hmr
location ~ ^/_next/(webpack-)?hmr {
    proxy_pass $frontend;
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
}

location / {
    proxy_pass $frontend;
}
