name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run lint-imports
      - run: uv run bandit -q -c pyproject.toml -r core config apps
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv run python manage.py spectacular --validate --fail-on-warn --file openapi.yml
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv export --no-dev --no-hashes --locked -o requirements.txt && uv run pip-audit -r requirements.txt

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: celebobo
          POSTGRES_PASSWORD: celebobo
          POSTGRES_DB: celebobo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U celebobo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://celebobo:celebobo@localhost:5432/celebobo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=xml --cov-fail-under=90
