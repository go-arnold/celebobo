[project]
name = "celebobo-api"
version = "0.1.0"
description = "Celebobo e-commerce API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-filter>=25.1",
    "django-cors-headers>=4.7",
    "django-environ>=0.12",
    "rules>=3.5",
    "structlog>=25.1",
    "celery[redis]>=5.5",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "django-allauth[socialaccount]>=65.4",
    "dj-rest-auth[with-social]>=7.0",
    "djangorestframework-simplejwt>=5.5",
    "django-stubs-ext>=5.2",
    "django-safedelete>=1.4",
    "channels>=4.2",
    "channels-redis>=4.2",
    "uvicorn[standard]>=0.34",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "faker>=33.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
    "celery-types>=0.23",
    "import-linter>=2.3",
    "pre-commit>=4.0",
    "pip-audit>=2.8",
    "bandit>=1.8",
    "pytest-asyncio>=0.25",
    "daphne>=4.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs", "*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "UP", "S", "SIM", "C4", "DJ", "PT", "RET",
    "ARG", "PTH", "PL", "RUF", "TID", "BLE", "T20", "ERA", "PIE", "PERF",
]
ignore = ["PLR0913", "PLR0911", "PLC0415", "N818"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "ARG001", "ARG002", "S105", "S106", "RUF012"]
"**/management/commands/*" = ["ARG002"]
"config/settings/*" = ["F403", "F405", "S105"]
"config/asgi.py" = ["E402"]
"**/api/**" = ["ARG001", "ARG002", "RUF012"]
"**/adapters/**" = ["ARG001", "ARG002"]
"**/admin.py" = ["RUF012", "ARG002"]
"**/domain/state_machine.py" = ["ARG002"]
"core/health/**" = ["ARG002", "BLE001"]
"core/observability/metrics.py" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "apps"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disable_error_code = ["type-abstract"]
exclude = ["^docs/", "^\\.venv/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = [
    "environ.*",
    "rules.*",
    "django_filters.*",
    "drf_spectacular.*",
    "corsheaders.*",
    "allauth.*",
    "dj_rest_auth.*",
    "safedelete.*",
    "channels.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["apps.catalog.models", "apps.catalog.repositories"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "apps.*.adapters.allauth",
    "apps.*.api.v1.auth_serializers",
    "apps.*.api.v1.views",
    "apps.realtime.consumers",
    "apps.realtime.adapters.auth",
]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["*.tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:The FORMS_URLFIELD_ASSUME_HTTPS transitional setting is deprecated:django.utils.deprecation.RemovedInDjango60Warning",
    "ignore:app_settings.AUTHENTICATION_METHOD is deprecated:UserWarning:dj_rest_auth.forms",
]

[tool.coverage.run]
source = ["core", "config"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.bandit]
exclude_dirs = [".venv", "docs", "*/tests/*", "config/settings/test.py"]
skips = ["B101", "B105"]

[tool.importlinter]
root_packages = ["core", "config", "apps"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is independent from config and apps"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["config", "apps"]

[[tool.importlinter.contracts]]
name = "core.domain is framework-free"
type = "forbidden"
source_modules = ["core.domain"]
forbidden_modules = ["django", "rest_framework", "celery", "structlog", "redis"]

[[tool.importlinter.contracts]]
name = "core layers"
type = "layers"
layers = [
    "core.bootstrap | core.testing",
    "core.api | core.health",
    "core.authz | core.events | core.observability | core.mail",
    "core.container | core.registry | core.conf",
    "core.domain",
]

[[tool.importlinter.contracts]]
name = "app domains are framework-free"
type = "forbidden"
source_modules = [
    "apps.accounts.domain",
    "apps.catalog.domain",
    "apps.orders.domain",
    "apps.messaging.domain",
    "apps.realtime.domain",
    "apps.media.domain",
    "apps.sales.domain",
    "apps.resellers.domain",
]
forbidden_modules = ["django", "rest_framework", "celery", "allauth", "dj_rest_auth"]

[[tool.importlinter.contracts]]
name = "app layers"
type = "layers"
containers = [
    "apps.accounts",
    "apps.catalog",
    "apps.orders",
    "apps.messaging",
    "apps.media",
    "apps.sales",
    "apps.resellers",
]
layers = [
    "api",
    "facades",
    "services",
    "repositories | selectors",
    "models",
    "domain",
]

[[tool.importlinter.contracts]]
name = "orders reaches other apps only through their public API"
type = "forbidden"
source_modules = ["apps.orders"]
forbidden_modules = [
    "apps.accounts.models",
    "apps.accounts.repositories",
    "apps.accounts.services",
    "apps.accounts.adapters",
    "apps.catalog.models",
    "apps.catalog.repositories",
    "apps.catalog.services.inventory",
    "apps.catalog.services.search",
    "apps.catalog.services.engagement",
    "apps.catalog.services.indexing",
    "apps.catalog.adapters",
]
ignore_imports = ["apps.orders.tests.** -> apps.**"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "messaging reaches other apps only through their public API"
type = "forbidden"
source_modules = ["apps.messaging"]
forbidden_modules = [
    "apps.accounts.models",
    "apps.accounts.repositories",
    "apps.accounts.services",
    "apps.accounts.adapters",
    "apps.orders.repositories",
    "apps.orders.services.cart",
    "apps.orders.services.checkout",
    "apps.orders.services.lifecycle",
    "apps.orders.services.pricing",
    "apps.orders.services.adjustments",
    "apps.orders.adapters",
    "apps.catalog",
]
ignore_imports = ["apps.messaging.tests.** -> apps.**"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "realtime layers"
type = "layers"
containers = ["apps.realtime"]
layers = ["consumers | handlers | api", "services", "domain"]

[[tool.importlinter.contracts]]
name = "realtime reaches other apps only through their public API"
type = "forbidden"
source_modules = ["apps.realtime"]
forbidden_modules = [
    "apps.accounts.models",
    "apps.accounts.repositories",
    "apps.accounts.services",
    "apps.accounts.adapters",
    "apps.messaging.models",
    "apps.messaging.repositories",
    "apps.messaging.services",
    "apps.messaging.adapters",
    "apps.orders.models",
    "apps.orders.repositories",
    "apps.orders.services",
    "apps.orders.adapters",
    "apps.catalog.models",
    "apps.catalog.repositories",
    "apps.catalog.services",
    "apps.catalog.adapters",
    "apps.sales.models",
    "apps.sales.repositories",
    "apps.sales.services",
    "apps.sales.adapters",
    "apps.resellers.models",
    "apps.resellers.repositories",
    "apps.resellers.services",
    "apps.resellers.adapters",
]
ignore_imports = ["apps.realtime.tests.** -> apps.**"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "sales reaches other apps only through their public API"
type = "forbidden"
source_modules = ["apps.sales"]
forbidden_modules = [
    "apps.accounts.models",
    "apps.accounts.repositories",
    "apps.accounts.services",
    "apps.accounts.adapters",
    "apps.catalog.models",
    "apps.catalog.repositories",
    "apps.catalog.services",
    "apps.catalog.adapters",
    "apps.orders.models",
    "apps.orders.repositories",
    "apps.orders.services",
    "apps.orders.adapters",
]
ignore_imports = ["apps.sales.tests.** -> apps.**"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "resellers reaches other apps only through their public API"
type = "forbidden"
source_modules = ["apps.resellers"]
forbidden_modules = [
    "apps.accounts.models",
    "apps.accounts.repositories",
    "apps.accounts.services",
    "apps.accounts.adapters",
    "apps.orders.models",
    "apps.orders.repositories",
    "apps.orders.services",
    "apps.orders.adapters",
    "apps.sales.models",
    "apps.sales.repositories",
    "apps.sales.services",
    "apps.sales.adapters",
]
ignore_imports = ["apps.resellers.tests.** -> apps.**"]
allow_indirect_imports = true
